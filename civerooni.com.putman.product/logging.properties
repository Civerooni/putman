# Putman logging configuration
#
# PutmanLogger level mapping:
#   error → SEVERE
#   warn  → WARNING
#   info  → INFO
#   debug → FINE
#   trace → FINEST

handlers=java.util.logging.ConsoleHandler
java.util.logging.ConsoleHandler.level=ALL
java.util.logging.ConsoleHandler.formatter=java.util.logging.SimpleFormatter
java.util.logging.SimpleFormatter.format=%1$tH:%1$tM:%1$tS.%1$tL [%4$s] %2$s%n%5$s%6$s%n

# Root level
.level=WARNING

# Putman — change to FINE (debug) or FINEST (trace) as needed
civerooni.com.putman.level=FINE
